name: Deploy to staging

on:
  # Manual trigger from the Actions tab — pick any branch to deploy
  workflow_dispatch:
  # Auto-deploy whenever the staging branch is pushed
  push:
    branches:
      - staging

# Never run two staging deploys at once; a new push waits for the current one
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # deploy-staging and postdeploy-staging pin --profile bluekeel, so
      # create that profile here instead of relying on ambient env credentials
      - name: Configure AWS profile
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
          [bluekeel]
          aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config <<EOF
          [profile bluekeel]
          region=us-east-1
          EOF

      - name: Build
        run: yarn build
        env:
          # CRA treats lint warnings as errors when CI=true; match local builds
          CI: false

      # yarn also runs postdeploy-staging (CloudFront invalidation) after this
      - name: Deploy
        run: yarn deploy-staging
